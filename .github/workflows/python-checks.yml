name: Python checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source files
        run: python -m py_compile kurtz.py kurtz_colors.py palacio.py river.py

      - name: Verify imports
        run: python -c "import kurtz, kurtz_colors, palacio, river"
